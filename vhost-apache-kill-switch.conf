# =========================================================
# INTERRUPTEUR DE MAINTENANCE : version VHOST Apache
#
# A utiliser quand vous administrez le serveur (VPS, dedie, conteneur).
# Si vous etes sur un hebergement mutualise, vous n'avez pas acces a ce
# fichier : prenez htaccess-kill-switch.conf a la place.
#
# Principe identique : un fichier temoin a la racine pilote un HTTP 503.
#   Site EN LIGNE     : le fichier s'appelle PAUSE-OFF.txt   (etat normal)
#   Mettre EN PAUSE   : renommer  PAUSE-OFF.txt  ->  PAUSE.txt
#   REMETTRE en ligne : renommer  PAUSE.txt      ->  PAUSE-OFF.txt
#
# POURQUOI LE VHOST PLUTOT QUE LE .HTACCESS, quand on a le choix :
#   1. Vitesse. Sans .htaccess a chercher et relire dans chaque repertoire
#      a chaque requete, Apache sert plus vite (cf. AllowOverride None).
#   2. Solidite. Un attaquant qui depose un .htaccess dans un repertoire
#      d'upload ne peut plus rien reecrire.
#   3. Simplicite. Le chemin du docroot est connu et fixe, donc le piege
#      %{DOCUMENT_ROOT} du mutualise ne se pose pas.
#
# A ADAPTER : les 3 chaines ci-dessous.
#   votre-site.fr        -> votre domaine
#   /var/www/votre-site  -> le chemin absolu de votre docroot
#   3600                 -> duree annoncee de l'interruption, en secondes
#
# Rechargement sans coupure :  apachectl configtest && systemctl reload apache2
# =========================================================

<VirtualHost *:443>
    ServerName votre-site.fr
    DocumentRoot /var/www/votre-site

    # -----------------------------------------------------
    # L'interrupteur
    # -----------------------------------------------------
    RewriteEngine On

    # Pas de garde %{HTTP_HOST} ici : on est deja dans le vhost du site,
    # donc la regle ne peut pas deborder sur un voisin. C'est toute la
    # difference avec la version mutualisee.
    RewriteCond /var/www/votre-site/PAUSE.txt -f [OR]
    RewriteCond /var/www/votre-site/pause.txt -f

    # On laisse passer la page de maintenance (sinon : boucle infinie)
    # et robots.txt (un robot doit toujours pouvoir lire les regles).
    RewriteCond %{REQUEST_URI} !^/(maintenance\.html|robots\.txt)$

    RewriteRule ^ - [E=JW_MAINT:1,R=503,L]

    ErrorDocument 503 /maintenance.html

    <IfModule mod_headers.c>
        # Les DEUX lignes sont necessaires : ErrorDocument declenche une
        # sous-requete interne, ou la variable d'environnement est prefixee
        # par REDIRECT_. Sans la seconde, l'en-tete manque sur la page servie.
        Header always set Retry-After "3600" env=JW_MAINT
        Header always set Retry-After "3600" env=REDIRECT_JW_MAINT
    </IfModule>

    # -----------------------------------------------------
    # Durcissement qui va avec
    # -----------------------------------------------------
    <Directory /var/www/votre-site>
        # Plus aucun .htaccess n'est lu : plus rapide, et un fichier
        # depose par un attaquant dans uploads/ devient inoffensif.
        # ⚠️ Si vous coupez AllowOverride, TOUTES les regles qui vivaient
        #    dans les .htaccess (dont celles de WordPress) doivent etre
        #    remontees ici. Ne le faites pas a moitie.
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Le fichier temoin n'a rien a faire sur le Web
    <FilesMatch "^(PAUSE\.txt|pause\.txt|PAUSE-OFF\.txt)$">
        Require all denied
    </FilesMatch>

    # Regles WordPress, remontees du .htaccess (obligatoire si AllowOverride None)
    <Directory /var/www/votre-site>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Aucune execution de PHP dans les repertoires d'upload
    <Directory /var/www/votre-site/wp-content/uploads>
        <FilesMatch "\.(?:php|phtml|php3|php4|php5|php7|phps|pht)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
