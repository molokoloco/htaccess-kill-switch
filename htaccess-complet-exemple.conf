# =========================================================
# .htaccess complet, exemple durci : WordPress + WooCommerce
# Domaine canonique : https://www.votre-site.fr
#
# Ce fichier est la version integrale dont htaccess-kill-switch.conf est
# extrait. Il ajoute a l'interrupteur : anti-reshell uploads, protection
# des fichiers sensibles, headers de securite, cache, gzip, bloc WordPress.
#
# 🔴 ESPACE MUTUALISE : si ce fichier est a la racine d'un docroot partage,
#    les sites voisins qui vivent DESSOUS sans .htaccess propre heritent de
#    tout ce qui est ecrit ici. Toute regle qui touche l'HOTE est gardee par
#    un RewriteCond %{HTTP_HOST}. NE PAS retirer ce garde.
#
# A ADAPTER : votre-site.fr, le chemin absolu du docroot, la duree Retry-After.
# =========================================================

DirectoryIndex index.php index.html

# ---------------------------------------------------------
# 🔌 INTERRUPTEUR DE MAINTENANCE, actionnable par le client seul
#
#   Site EN LIGNE     : le fichier « PAUSE-OFF.txt » est present (etat normal)
#   Mettre EN PAUSE   : renommer  PAUSE-OFF.txt  ->  PAUSE.txt
#   REMETTRE en ligne : renommer  PAUSE.txt      ->  PAUSE-OFF.txt
#   Fichier temoin a la RACINE du docroot du site.
#
#   En pause : HTTP 503 + /maintenance.html + Retry-After 1 h.
#   503 = « repassez plus tard » : Google met en pause, ne desindexe pas.
#   robots.txt reste servi (les robots doivent pouvoir le lire).
#
# 🔴 DEUX GARDES OBLIGATOIRES, NE PAS LES RETIRER :
#   1. RewriteCond %{HTTP_HOST} : sans lui la regle cascade sur les sites
#      voisins qui vivent SOUS ce docroot (incident reel : 3 sites coupes
#      d'un coup par une regle destinee a un seul).
#   2. Chemin ABSOLU du fichier temoin. %{DOCUMENT_ROOT} est INUTILISABLE
#      chez IONOS : il vaut « /var/www/html » pour TOUS les vhosts de
#      l'espace. Le test -f echoue, et %{DOCUMENT_ROOT} -d repond vrai, donc
#      une regle ecrite avec lui serait silencieusement fausse et partagee
#      entre tous les sites. Les tests relatifs echouent aussi.
#      Seul le chemin absolu fonctionne (verifie sur deux vhosts).
# ---------------------------------------------------------
<IfModule mod_rewrite.c>
	RewriteEngine On

	RewriteCond %{HTTP_HOST} ^(www\.)?votre-site\.fr$ [NC]
	RewriteCond /kunden/homepages/NN/dXXXXXXXXX/htdocs/PAUSE.txt -f [OR]
	RewriteCond /kunden/homepages/NN/dXXXXXXXXX/htdocs/pause.txt -f
	RewriteCond %{REQUEST_URI} !^/maintenance\.html$
	RewriteCond %{REQUEST_URI} !^/robots\.txt$
	# OPTION : votre IP passe pendant la pause (voir htaccess-kill-switch.conf).
	# RewriteCond %{REMOTE_ADDR} !^203\.0\.113\.42$
	RewriteRule ^ - [E=JW_MAINT:1,R=503,L]
</IfModule>

ErrorDocument 503 /maintenance.html

<IfModule mod_headers.c>
	# Les DEUX lignes : Apache prefixe la variable par REDIRECT_ dans la
	# sous-requete interne qui rend ErrorDocument.
	Header always set Retry-After "3600" env=JW_MAINT
	Header always set Retry-After "3600" env=REDIRECT_JW_MAINT
</IfModule>

# Le fichier temoin n'a rien a faire sur le Web
<FilesMatch "^(PAUSE\.txt|pause\.txt|PAUSE-OFF\.txt)$">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		Order allow,deny
		Deny from all
	</IfModule>
</FilesMatch>

# ---------------------------------------------------------
# Canonique : HTTPS + www (garde d'hote obligatoire)
# ---------------------------------------------------------
<IfModule mod_rewrite.c>
	RewriteEngine On

	# Garde : n'agir que sur ce domaine, protege les voisins du docroot.
	RewriteCond %{HTTP_HOST} ^(www\.)?votre-site\.fr$ [NC]
	# Ne pas canonicaliser la page de maintenance : sinon la sous-requete
	# interne de ErrorDocument repart en 301 et le 503 est perdu.
	RewriteCond %{REQUEST_URI} !^/maintenance[.]html$
	RewriteCond %{HTTPS} !=on [OR]
	RewriteCond %{HTTP_HOST} ^votre-site\.fr$ [NC]
	RewriteRule ^ https://www.votre-site.fr%{REQUEST_URI} [R=301,L]
</IfModule>

# ---------------------------------------------------------
# Options serveur
# ---------------------------------------------------------
Options -Indexes
Options +FollowSymLinks
ServerSignature Off
AddDefaultCharset UTF-8

# ---------------------------------------------------------
# 🔴 Anti-reshell : aucune execution de PHP dans les repertoires d'upload
#    Ce site avait heberge plusieurs dizaines de webshells. Un fichier
#    redepose dans uploads/ renvoie 403 au lieu de s'executer. Aucun plugin
#    legitime n'execute de PHP depuis uploads/.
# ---------------------------------------------------------
<IfModule mod_rewrite.c>
	RewriteRule ^wp-content/uploads/.*\.(?:php|phtml|php3|php4|php5|php7|phps|pht)$ - [F,L,NC]
</IfModule>

# ---------------------------------------------------------
# Protection fichiers sensibles
# ---------------------------------------------------------
<FilesMatch "^(wp-config\.php|\.htaccess|\.htpasswd|\.user\.ini|php\.ini|readme\.html|license\.txt)$">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		Order allow,deny
		Deny from all
	</IfModule>
</FilesMatch>

# Bloque wp-content/debug.log
<IfModule mod_rewrite.c>
	RewriteRule ^wp-content/debug\.log$ - [F,L,NC]
</IfModule>

# Desactive xmlrpc.php (surface d'attaque, inutile a la plupart des sites)
<Files "xmlrpc.php">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		Order allow,deny
		Deny from all
	</IfModule>
</Files>

# ---------------------------------------------------------
# Headers de securite
#   HSTS SANS includeSubDomains : sur un espace mutualise, l'en-tete
#   contaminerait les sous-domaines des sites voisins. Envoye en HTTPS seul.
# ---------------------------------------------------------
<IfModule mod_headers.c>
	Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
	Header unset ETag
</IfModule>
FileETag None

# ---------------------------------------------------------
# MIME types utiles
# ---------------------------------------------------------
<IfModule mod_mime.c>
	AddType application/vnd.ms-fontobject .eot
	AddType font/ttf .ttf
	AddType font/otf .otf
	AddType application/font-woff .woff
	AddType font/woff2 .woff2
	AddType image/webp .webp
	AddType image/avif .avif
</IfModule>

# ---------------------------------------------------------
# Cache navigateur
# ---------------------------------------------------------
<IfModule mod_expires.c>
	ExpiresActive On
	ExpiresDefault "access plus 7 days"

	ExpiresByType image/jpeg "access plus 1 month"
	ExpiresByType image/png "access plus 1 month"
	ExpiresByType image/gif "access plus 1 month"
	ExpiresByType image/webp "access plus 1 month"
	ExpiresByType image/avif "access plus 1 month"
	ExpiresByType image/svg+xml "access plus 1 month"
	ExpiresByType image/x-icon "access plus 1 year"
	ExpiresByType image/vnd.microsoft.icon "access plus 1 year"

	ExpiresByType text/css "access plus 7 days"
	ExpiresByType text/javascript "access plus 7 days"
	ExpiresByType application/javascript "access plus 7 days"

	ExpiresByType font/woff2 "access plus 1 year"
	ExpiresByType application/font-woff "access plus 1 year"
	ExpiresByType application/vnd.ms-fontobject "access plus 1 year"
	ExpiresByType font/ttf "access plus 1 year"
	ExpiresByType font/otf "access plus 1 year"
</IfModule>

<IfModule mod_headers.c>
	<FilesMatch "\.(ico|jpg|jpeg|png|gif|webp|avif|svg)$">
		Header append Vary Accept
		Header set Cache-Control "public, max-age=2592000"
	</FilesMatch>
	<FilesMatch "\.(ttf|ttc|otf|eot|woff|woff2)$">
		Header set Access-Control-Allow-Origin "*"
		Header set Cache-Control "public, max-age=31536000, immutable"
	</FilesMatch>
	<FilesMatch "\.(css|js)$">
		Header set Cache-Control "public, max-age=604800"
	</FilesMatch>
</IfModule>

# ---------------------------------------------------------
# Compression gzip
# ---------------------------------------------------------
<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE text/plain
	AddOutputFilterByType DEFLATE text/html
	AddOutputFilterByType DEFLATE text/xml
	AddOutputFilterByType DEFLATE text/css
	AddOutputFilterByType DEFLATE text/javascript
	AddOutputFilterByType DEFLATE application/javascript
	AddOutputFilterByType DEFLATE application/x-javascript
	AddOutputFilterByType DEFLATE application/xml
	AddOutputFilterByType DEFLATE application/xhtml+xml
	AddOutputFilterByType DEFLATE application/rss+xml
	AddOutputFilterByType DEFLATE application/json
	AddOutputFilterByType DEFLATE image/svg+xml
	AddOutputFilterByType DEFLATE font/ttf
	AddOutputFilterByType DEFLATE font/otf
	AddOutputFilterByType DEFLATE application/font-woff
	AddOutputFilterByType DEFLATE application/vnd.ms-fontobject

	SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|avif|mp4|mov|avi|pdf)$ no-gzip dont-vary
	<IfModule mod_headers.c>
		Header append Vary Accept-Encoding
	</IfModule>
</IfModule>

# BEGIN WordPress
# Les directives entre « BEGIN WordPress » et « END WordPress » sont generees
# dynamiquement et ne doivent etre modifiees que via les filtres WordPress.
<IfModule mod_rewrite.c>
	RewriteEngine On
	RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
	RewriteBase /
	RewriteRule ^index\.php$ - [L]
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule . /index.php [L]
</IfModule>
# END WordPress
