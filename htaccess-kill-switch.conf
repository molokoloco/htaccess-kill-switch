# =========================================================
# INTERRUPTEUR DE MAINTENANCE .htaccess (bloc seul)
# A coller EN HAUT du .htaccess du site, avant tout le reste.
#
# Principe : un fichier temoin a la racine du site pilote un HTTP 503.
#   Site EN LIGNE     : le fichier s'appelle PAUSE-OFF.txt   (etat normal)
#   Mettre EN PAUSE   : renommer  PAUSE-OFF.txt  ->  PAUSE.txt
#   REMETTRE en ligne : renommer  PAUSE.txt      ->  PAUSE-OFF.txt
#
# En pause : HTTP 503 + /maintenance.html + Retry-After 3600.
# 503 = « repassez plus tard » : Google met l'exploration en pause,
# il ne desindexe pas (a la difference d'un 404 ou d'un 410).
#
# A ADAPTER : les 3 chaines ci-dessous.
#   votre-site.fr                         -> votre domaine
#   /kunden/homepages/NN/dXXXXXXXXX/htdocs/ -> le chemin ABSOLU de votre docroot
#   3600                                  -> duree annoncee de l'interruption (s)
# Le chemin absolu se lit dans le gestionnaire de fichiers de l'hebergeur,
# ou via un <?php echo __DIR__; ?> pose 30 secondes a la racine.
# =========================================================

<IfModule mod_rewrite.c>
	RewriteEngine On

	# GARDE 1 : l'hote. Sur un mutualise, plusieurs domaines peuvent partager
	# le meme docroot ou vivre dans un sous-dossier de celui-ci. Sans ce
	# RewriteCond, couper un site coupe TOUS les voisins d'un seul coup.
	# Incident reel : 3 sites eteints par une regle destinee a un seul.
	RewriteCond %{HTTP_HOST} ^(www\.)?votre-site\.fr$ [NC]

	# GARDE 2 : chemin ABSOLU du fichier temoin, jamais %{DOCUMENT_ROOT}.
	# Piege mesure chez IONOS : %{DOCUMENT_ROOT} vaut « /var/www/html » pour
	# TOUS les vhosts de l'espace. Consequence en cascade :
	#   - le test « %{DOCUMENT_ROOT}/PAUSE.txt -f » est toujours FAUX,
	#   - le test « %{DOCUMENT_ROOT} -d » repond VRAI, donc une regle ecrite
	#     avec lui a l'air de marcher et branche en realite un interrupteur
	#     unique sur tous les sites de l'espace.
	# Les chemins relatifs echouent aussi. Seul l'absolu est fiable.
	# Les deux casses sont testees : un client qui tape « pause.txt » en
	# minuscules doit quand meme couper son site.
	RewriteCond /kunden/homepages/NN/dXXXXXXXXX/htdocs/PAUSE.txt -f [OR]
	RewriteCond /kunden/homepages/NN/dXXXXXXXXX/htdocs/pause.txt -f

	# EXCLUSION 1 : la page de maintenance elle-meme, sinon ErrorDocument
	# boucle sur son propre 503.
	RewriteCond %{REQUEST_URI} !^/maintenance\.html$

	# EXCLUSION 2 : robots.txt reste servi. Les robots doivent pouvoir le
	# lire pendant l'interruption, sinon ils repartent sur leur cache.
	RewriteCond %{REQUEST_URI} !^/robots\.txt$

	# La regle : tout le reste part en 503. E=JW_MAINT marque la requete
	# pour que mod_headers sache y attacher le Retry-After.
	RewriteRule ^ - [E=JW_MAINT:1,R=503,L]
</IfModule>

# La page servie en 503. Autonome, noindex, zero requete externe.
ErrorDocument 503 /maintenance.html

<IfModule mod_headers.c>
	# LES DEUX LIGNES SONT NECESSAIRES. Apache prefixe les variables
	# d'environnement par REDIRECT_ dans la sous-requete interne qui rend
	# ErrorDocument : sans la seconde ligne, le Retry-After manque sur la
	# reponse reellement envoyee au client.
	Header always set Retry-After "3600" env=JW_MAINT
	Header always set Retry-After "3600" env=REDIRECT_JW_MAINT
</IfModule>

# Le fichier temoin n'a rien a faire sur le Web : 403 en HTTP,
# dans les deux etats et dans les deux casses.
<FilesMatch "^(PAUSE\.txt|pause\.txt|PAUSE-OFF\.txt)$">
	<IfModule mod_authz_core.c>
		Require all denied
	</IfModule>
	<IfModule !mod_authz_core.c>
		Order allow,deny
		Deny from all
	</IfModule>
</FilesMatch>

# ---------------------------------------------------------
# PIEGE 3, si votre .htaccess force une URL canonique (HTTPS et/ou www) :
# la redirection 301 s'applique aussi a la sous-requete interne de
# ErrorDocument, et elle mange le 503 (le visiteur recoit un 301 vers une
# page de maintenance servie en 200). Ajoutez cette exclusion DANS votre
# bloc canonique, avant la RewriteRule 301 :
#
#   RewriteCond %{REQUEST_URI} !^/maintenance[.]html$
# ---------------------------------------------------------
