# ---------------------------------------------------------------------------
# INTERRUPTEUR DE MAINTENANCE : version NGINX
# https://github.com/molokoloco/htaccess-kill-switch
#
# Nginx ne lit PAS les .htaccess : sa configuration est centralisee. Ce fichier
# suppose donc un acces au vhost (VPS, dedie, conteneur). Sur un mutualise nginx
# sans acces a la conf, ce kit ne s'applique pas : demandez a l'hebergeur.
#
# PRINCIPE, identique a la version Apache : le NOM du fichier porte l'etat.
#   PAUSE-OFF.txt  -> site en ligne
#   PAUSE.txt      -> site en pause, HTTP 503 sur tout
# Basculer = renommer le fichier. AUCUN rechargement de nginx necessaire.
#
# A ADAPTER : votre-site.fr, /var/www/votre-site, et la duree 3600.
# Recharger apres modification :  nginx -t && nginx -s reload
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name votre-site.fr www.votre-site.fr;

    # `root` DOIT rester declare ici, au niveau server (voir la note sur
    # $document_root plus bas).
    root /var/www/votre-site;
    index index.php index.html;

    # =======================================================================
    # 1) L'INTERRUPTEUR
    # =======================================================================
    #
    # NOTE SUR `if` : non, ce n'est pas "evil" ici, et ce n'est pas une opinion.
    # La page officielle s'intitule "If is Evil... WHEN USED IN LOCATION CONTEXT"
    # et precise : "it's also possible to move ifs to server level (where it's
    # safe as only other rewrite module directives are allowed within it)".
    # C'est exactement ce bloc. NE PAS redescendre ces `if` dans une location.
    #   https://github.com/nginxinc/nginx-wiki/blob/master/source/start/topics/depth/ifisevil.rst
    #
    # Avantage architectural : au niveau server, le test tourne en phase
    # SERVER_REWRITE, donc AVANT le choix de la location. Le 503 court-circuite
    # tout : PHP-FPM, proxy_pass, et un webshell depose dans wp-content/uploads.

    set $maintenance 0;

    # Chemin ABSOLU volontairement en dur, PAS $document_root.
    # $document_root vaut "la valeur de root pour la requete courante" ; a ce
    # stade la location n'est pas encore choisie et nginx utilise la conf de la
    # location par defaut du serveur. Ca fonctionne donc tant que root est
    # declare au niveau server -- mais si vous collez ce bloc dans un vhost qui
    # declare root uniquement dans ses location, $document_root retombe sur le
    # "html" par defaut et l'interrupteur ne se declenche JAMAIS, en silence.
    if (-f /var/www/votre-site/PAUSE.txt) {
        set $maintenance 1;
    }

    # --- Exemptions : ce qui repond normalement pendant la pause -------------

    # robots.txt DOIT rester en 200. S'il repond 5xx, Google arrete de crawler
    # le site pendant 12 h puis se rabat sur son cache de 30 jours.
    #
    # On utilise $uri (normalise, SANS query string) et surtout PAS
    # $request_uri : avec $request_uri, "/robots.txt?v=2" ne matche pas
    # l'ancre de fin et partirait en 503. Bug silencieux et exactement le
    # cas que Google penalise.
    if ($uri = "/robots.txt") {
        set $maintenance 0;
    }

    # Let's Encrypt (challenge HTTP-01) et security.txt. Sans cette ligne, une
    # pause de quelques semaines fait echouer le renouvellement du certificat :
    # vous vous retrouvez avec un TLS expire en plus du reste.
    if ($uri ~ "^/\.well-known/") {
        set $maintenance 0;
    }

    # Decommenter pour garder un acces depuis votre IP pendant la pause.
    # ⚠️ Derriere un CDN ou un proxy, $remote_addr est l'adresse du PROXY,
    #    pas la votre : verifiez ce que le serveur voit avant d'y compter.
    # if ($remote_addr = "203.0.113.10") { set $maintenance 0; }

    if ($maintenance = 1) {
        return 503;
    }

    # =======================================================================
    # 2) LA PAGE DE MAINTENANCE
    # =======================================================================
    #
    # 🔴 PAS DE SIGNE EGAL APRES 503. C'est le piege le plus couteux du fichier.
    #   error_page 503 @maintenance;    -> conserve le 503   <- CE QU'ON VEUT
    #   error_page 503 = @maintenance;  -> ADOPTE le code du handler, donc 200
    # La doc nginx illustre pourtant les locations nommees avec
    # "error_page 404 = @fallback;". Recopier ce "=" ici transformerait le 503
    # en 200 et ferait desindexer le site, ce que tout le dispositif cherche
    # precisement a eviter.
    #
    # error_page doit AUSSI rester au niveau server : quand le 503 est leve, la
    # location n'a pas encore ete choisie. Place dans un location, il ne serait
    # jamais trouve et le client recevrait la page 503 nue de nginx.
    error_page 503 @maintenance;

    location @maintenance {
        # Redeclare explicitement : l'heritage fonctionne, mais on ne veut pas
        # que la page de pause dependre d'un root defini ailleurs.
        root /var/www/votre-site;

        # "always" est OBLIGATOIRE : sans lui, add_header ne s'applique qu'aux
        # codes 200/201/204/206/301/302/303/304/307/308. 503 n'y figure pas,
        # l'en-tete serait purement et simplement absent de la reponse.
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # ⚠️ Des qu'un add_header existe ici, TOUS les add_header du niveau
        #    server (HSTS, X-Frame-Options, X-Content-Type-Options...) cessent
        #    d'etre herites. Si votre vhost en a, recopiez-les ci-dessus.

        # "=503", et surtout pas "rewrite ^ /maintenance.html break" ni "=404".
        # La doc error_page dit : "If uri processing leads to an error, the
        # status code of the last occurred error is returned to the client".
        # Donc si maintenance.html est absent ou mal place, ces deux formes
        # renvoient un 404 SILENCIEUX a la place du 503. Avec "=503", le pire
        # cas reste un 503 nu, ce qui est exactement ce qu'on veut.
        # Pas de boucle possible : recursive_error_pages vaut "off" par defaut.
        try_files /maintenance.html =503;
    }

    # Empeche maintenance.html d'etre atteignable et indexable directement hors
    # maintenance. N'interfere pas avec le try_files ci-dessus, qui traite le
    # fichier dans le contexte courant, sans nouvelle recherche de location.
    location = /maintenance.html {
        internal;
    }

    # =======================================================================
    # 3) CONFIGURATION NORMALE DU SITE (exemple WordPress)
    # =======================================================================

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Le fichier temoin n'a rien a faire sur le Web
    location ~ ^/(PAUSE\.txt|pause\.txt|PAUSE-OFF\.txt)$ {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# LIMITE CONNUE : open_file_cache
#
# Le test -f passe par le cache de fichiers ouverts de nginx. Si le vhost
# active "open_file_cache" ET "open_file_cache_errors on", l'absence du fichier
# temoin est mise en cache et la bascule peut prendre jusqu'a la valeur de
# "open_file_cache_valid" (60 s par defaut) avant de prendre effet.
# Par defaut les deux sont "off", donc le probleme ne se pose pas.
#
# RECETTE DE VERIFICATION
#
#   nginx -t && nginx -s reload
#
#   # 1. En ligne : attendu 200
#   mv PAUSE.txt PAUSE-OFF.txt
#   curl -sS -o /dev/null -w '%{http_code}\n' https://votre-site.fr/
#
#   # 2. En pause : attendu 503 + Retry-After: 3600
#   mv PAUSE-OFF.txt PAUSE.txt
#   curl -sSI https://votre-site.fr/une/page/profonde/ | head -n 5
#
#   # 3. Exemptions : attendu 200 sur les DEUX (le second echouait avec
#   #    $request_uri, c'est le test qui prouve la correction)
#   curl -sS -o /dev/null -w '%{http_code}\n' https://votre-site.fr/robots.txt
#   curl -sS -o /dev/null -w '%{http_code}\n' 'https://votre-site.fr/robots.txt?v=2'
#
#   # 4. MODE DEGRADE : le test qui compte
#   mv maintenance.html maintenance.html.bak
#   curl -sS -o /dev/null -w '%{http_code}\n' https://votre-site.fr/   # 503, PAS 404
#   mv maintenance.html.bak maintenance.html
# ---------------------------------------------------------------------------
